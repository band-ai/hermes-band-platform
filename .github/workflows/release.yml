name: Release

# Versioning only. release-please turns conventional-commit history on `main`
# into a release PR, then a tag + GitHub Release when that PR merges.
#
# Nothing is published here. The two publish paths both react to the GitHub
# Release this workflow creates:
#   - pypi-publish.yml  → the hermes-band distribution on PyPI
#   - package.yml       → the drop-in directory-plugin bundles on the Release
# Keying both off the durable Release means no failure after the tag can strand
# a tagged release unpublished, and either is re-runnable on its own.
#
# Modeled on band-ai/band-sdk-python, which publishes band-sdk on every run —
# same App, same action, same release-please setup. Diff against it first when
# releases break. See RELEASING.md for the one-time setup.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    # This is what confines release-please to runs on `main`, and it is the only
    # layer that cannot be edited on the branch it is guarding (the step's
    # `target-branch: main` below travels with the file). The `release`
    # environment's deployment policy allows only branch `main` and tag `v*`, and
    # GitHub matches the run's ref against it before the job starts — so a
    # workflow_dispatch of a doctored copy of this file from a side branch is
    # refused rather than tagging from that branch. Not vestigial: publishing
    # moved out, this guard did not.
    #
    # The environment is shared with pypi-publish.yml's publish job. Adding
    # required reviewers here to gate uploads would also gate every
    # release-please run on main behind a human approval; an upload-only
    # approval gate needs its own environment (registered with PyPI as the
    # trusted publisher's environment).
    environment: release
    concurrency: release
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Deviation from band-sdk-python, kept deliberately: an org secret that
      # isn't scoped to this repo arrives as an empty string with no warning,
      # and create-github-app-token reports it as an opaque auth failure. That
      # exact shape cost this pipeline every run from 2026-06-18 to 2026-07-26.
      # Six lines to name the missing secret instead of rediscovering it.
      - name: Check App secrets are visible to this repo
        env:
          client_id: ${{ secrets.APP_CLIENT_ID }}
          private_key: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          missing=()
          [ -n "$client_id" ]   || missing+=("APP_CLIENT_ID")
          [ -n "$private_key" ] || missing+=("APP_PRIVATE_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=GitHub App secrets not visible to this repo::Missing secret(s): ${missing[*]}. They are band-ai org secrets scoped to selected repositories — check that hermes-band-platform is on the access list for each, AND that it is on the band-release-please-public App installation's repository list. See RELEASING.md, 'One-time setup'."
            exit 1
          fi

      # The official action derives the installation from the App, so APP_ID and
      # INSTALLATION_ID are not needed (and do not exist in this org).
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Release Please
        # Commit-pinned to prevent mutable release tags from changing the
        # release workflow; Dependabot updates this SHA with each v5 release.
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      - name: Sync generated root manifest into the release PR
        # release-please bumps only the packaged manifest (single source of
        # truth); the root plugin.yaml is generated from it. When a release PR
        # is open, regenerate the root file on the PR branch so it lands with
        # the version bump and `main` is never stale.
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # A step's env templates are evaluated even when its `if` is false, so
          # this must stay total on release-creating merges, where the `pr`
          # output is empty and a bare fromJSON('') fails the whole job.
          PR_BRANCH: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
        run: |
          set -euo pipefail
          # The release PR branch is created by the step above, i.e. after the
          # checkout ran, so this clone has no ref for it. Fetch an explicit
          # refspec into a named remote-tracking ref and branch from that ref by
          # name, instead of relying on `git fetch origin <branch>` seeding
          # refs/remotes/origin/* as a side effect for `git checkout` to DWIM.
          # -B is unconditional so a re-run over a clone that already has the
          # branch resets it to the remote tip rather than failing.
          git fetch origin "+refs/heads/$PR_BRANCH:refs/remotes/origin/$PR_BRANCH"
          git checkout -B "$PR_BRANCH" "origin/$PR_BRANCH"
          python3 scripts/sync_root_manifest.py --write
          if ! git diff --quiet -- plugin.yaml; then
            git config user.name "band-release-bot"
            git config user.email "release-bot@band.ai"
            git add plugin.yaml
            git commit -m "chore: regenerate root plugin.yaml from packaged manifest"
            # Push with the App token (not the default GITHUB_TOKEN) so the PR's
            # CI re-runs against the regenerated manifest.
            git -c http.extraheader="AUTHORIZATION: bearer $GH_TOKEN" push origin "HEAD:$PR_BRANCH"
          fi

  summary:
    needs: [release]
    if: ${{ always() && needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish release summary
        run: |
          {
            echo "## Release Summary"
            echo ""
            echo "**Version:** ${{ needs.release.outputs.major }}.${{ needs.release.outputs.minor }}.${{ needs.release.outputs.patch }}"
            echo "**Tag:** ${{ needs.release.outputs.tag_name }}"
            echo ""
            echo "Publishing runs in the release-triggered workflows:"
            echo "- \`pypi-publish\` — hermes-band to PyPI"
            echo "- \`package\` — directory-plugin bundles onto the Release"
          } >> "$GITHUB_STEP_SUMMARY"
