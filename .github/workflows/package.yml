name: Package directory plugin

on:
  release:
    types: [published]

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Assemble directory-plugin bundle
        run: |
          set -euo pipefail
          # Stage band/ = the contents of hermes_band_platform/ so the bundle is a
          # drop-in for ~/.hermes/plugins/band/ (band/plugin.yaml, band/__init__.py,
          # band/adapter.py, band/tools.py, band/skills/...).
          rm -rf staging
          mkdir -p staging/band
          cp -r hermes_band_platform/. staging/band/
          # Strip caches.
          find staging -name '__pycache__' -type d -prune -exec rm -rf {} +
          find staging -name '*.pyc' -delete

          # Ship the installer next to band/ so an extracted bundle is
          # self-installing (install.sh detects the band/ layout).
          cp install.sh staging/

          tag="${GITHUB_REF_NAME}"
          # The asset names stay `hermes-band-platform-*` and are outside the
          # rename of the Python distribution to `hermes-band`. These are named
          # after the GitHub repo, which keeps its name, and what they contain is
          # a directory plugin (band/ + install.sh) — not a Python distribution,
          # so there is nothing here for the dist name to describe. Renaming them
          # would only break every install doc and link that names an asset.
          ( cd staging && tar -czf "../hermes-band-platform-${tag}.tar.gz" band install.sh )
          ( cd staging && zip -qr "../hermes-band-platform-${tag}.zip" band install.sh )
          ls -l hermes-band-platform-*.tar.gz hermes-band-platform-*.zip

      - name: Upload bundles to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            hermes-band-platform-*.tar.gz \
            hermes-band-platform-*.zip \
            --clobber
